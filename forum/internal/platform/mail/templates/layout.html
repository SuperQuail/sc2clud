<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
</head>
<body style="margin:0;background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif;color:#222">
<div style="max-width:560px;margin:0 auto;padding:32px 16px">
<div style="font-size:16px;font-weight:600;padding-bottom:16px">{{.SiteName}}</div>
<div style="background:#fff;border:1px solid #e5e5e5;border-radius:8px;padding:24px;font-size:14px;line-height:1.7">
{{.Body}}
</div>
<div style="padding-top:16px;font-size:12px;color:#888">这封邮件由 {{.SiteName}} 系统自动发出，请勿直接回复。</div>
</div>
</body>
</html>
