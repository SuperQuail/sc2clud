[package]
name = "sc2clud-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SC2clud 可执行入口：配置装载、日志、优雅退出"

[[bin]]
name = "sc2clud"
path = "src/main.rs"

[dependencies]
sc2clud-core.workspace = true
sc2clud-storage.workspace = true
sc2clud-db.workspace = true
sc2clud-web.workspace = true
anyhow = "1.0.104"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "signal", "macros", "time", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2.5"
axum = "0.8.9"

[dev-dependencies]
