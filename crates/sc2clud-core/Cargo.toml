[package]
name = "sc2clud-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SC2clud 领域核心：错误、配置、路径安全、限速与计数聚合（不依赖 Web / DB / 具体存储）"

[dependencies]
blake3 = "1.8.7"
md-5 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = "1.1.7"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
