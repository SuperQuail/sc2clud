{# 评论条目：帖子评论与 issue 评论共用（头像 + 名字/时间 + 正文）。
   调用方通过 {% let c = ... %} 传入带 author/avatar/body/created 的对象。 #}
{% if let Some(hash) = c.avatar %}
<img class="avatar c-avatar" src="/avatar/{{ hash }}" alt="" width="40" height="40" loading="lazy">
{% else %}
<img class="avatar c-avatar" src="/static/art/miyin-chibi-80.webp" alt="" width="40" height="40" loading="lazy">
{% endif %}
<div class="c-main">
  <div class="c-head">
    <b class="c-name">{{ c.author }}</b>
    <span class="c-time">{{ c.created }}</span>
  </div>
  <div class="c-text">{{ c.body }}</div>
</div>
