{% extends "base.html" %}

{% block title %}登录 · {{ site_name }}{% endblock %}

{% block content %}
<section class="card auth-card">
  <h2>登录</h2>
  {% if let Some(message) = error %}
  <p class="alert">{{ message }}</p>
  {% endif %}
<form method="post" action="/login" class="stack">
  <label>用户名或邮箱<input type="text" name="account" value="{{ account }}" required autocomplete="username"></label>
  <label>口令<input type="password" name="password" required autocomplete="current-password"></label>
  <button class="btn" type="submit">登录</button>
</form>
  <p class="hint">还没有账号？<a href="/register">注册一个</a>。注册后可能需要管理员激活。</p>
</section>
{% endblock %}
