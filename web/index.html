<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!-- Go 壳按实例注入：生产 /，dev /dev/。相对资源 URL 全靠它解析，深链接才不会丢前缀 -->
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SC2clud</title>
    <!-- 上面这行 title 是 Go meta 壳的锚点：Go 启动时校验它存在，请求时整块替换为
         <title>页面标题 - SC2clud</title> + description + canonical + Open Graph（前端方案 §2.4）。
         找不到锚点必须启动失败，不允许静默不替换。 -->
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('theme');
          var p = q === 'light' || q === 'dark' || q === 'system' ? q : localStorage.getItem('theme');
          if (p !== 'light' && p !== 'dark') p = 'system';
          var dark = p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.themePreference = p;
          if (dark) document.documentElement.classList.add('ring-ui-theme-dark');
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
