<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!-- Go 壳按实例注入：生产 /，dev /dev/。相对资源 URL 全靠它解析，深链接才不会丢前缀 -->
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SC2clud</title>
    <!-- 上面这行 title 是 Go meta 壳的锚点：Go 启动时校验它存在，请求时整块替换为
         <title>页面标题 - SC2clud</title> + description + canonical + Open Graph（前端方案 §2.4）。
         找不到锚点必须启动失败，不允许静默不替换。 -->
    <script>
      // 全站唯一允许的内联脚本：首次绘制前定好主题，避免深色用户看到白闪（前端方案 §7.1）
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          if (theme === 'dark') document.documentElement.classList.add('ring-ui-theme-dark');
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
