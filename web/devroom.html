<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DevRoom · 控件验证</title>
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('theme');
          var p = q === 'light' || q === 'dark' || q === 'system' ? q : localStorage.getItem('theme');
          if (p !== 'light' && p !== 'dark') p = 'system';
          var dark = p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.themePreference = p;
          if (dark) document.documentElement.classList.add('ring-ui-theme-dark');
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/devroom/main.tsx"></script>
  </body>
</html>
