<!doctype html>
<html><head><meta charset="utf-8"><title>diag</title></head>
<body style="margin:0">
<pre id="out"></pre>
<script>
  const w = Number(new URLSearchParams(location.search).get('w') || 375);
  const url = '/preview-c.html?v=' + (new URLSearchParams(location.search).get('v') || '1') + '&theme=light&view=card';
  const f = document.createElement('iframe');
  f.style.cssText = 'width:' + w + 'px;height:900px;border:0';
  document.body.appendChild(f);
  f.onload = () => {
    const d = f.contentDocument;
    const de = d.documentElement;
    const lines = ['viewport=' + w + ' docScrollW=' + de.scrollWidth + ' bodyScrollW=' + d.body.scrollWidth];
    const els = d.querySelectorAll('body *');
    for (const el of els) {
      const r = el.getBoundingClientRect();
      if (r.right > w + 1 && r.width > 40) {
        lines.push(Math.round(r.left) + '..' + Math.round(r.right) + ' w=' + Math.round(r.width) + ' <' + el.tagName.toLowerCase() + '> ' + (el.className || '').toString().slice(0, 80));
      }
      if (lines.length > 26) break;
    }
    document.getElementById('out').textContent = lines.join('\n');
  };
</script>
</body></html>
