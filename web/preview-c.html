<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>方向 C 预览（贴吧血统，不进产品构建）</title>
    <script>
      (function () {
        var q = new URLSearchParams(location.search).get('theme');
        var t = q === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        if (t === 'dark') document.documentElement.classList.add('ring-ui-theme-dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/preview/style-c/runner.tsx"></script>
  </body>
</html>
