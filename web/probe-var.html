<!doctype html><html><head><meta charset='utf-8'><style>body{font:13px system-ui;padding:16px}img{width:240px;height:160px;border:1px solid #333;display:block;margin:6px 0;background:#fafafa}</style></head>
<body><div id='root'></div>
<script>
const variants = {
  'A: fill=var(--primary) 直接用在 rect': 'data:image/svg+xml,' + ('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">' + "<rect width='1200' height='800' fill='var(--primary)'/>" + '</svg>').split('#').join('%23'),
  'B: stroke=var(--foreground) 圆环': 'data:image/svg+xml,' + ('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">' + "<circle cx='400' cy='400' r='200' fill='none' stroke='var(--foreground)' stroke-width='40'/>" + '</svg>').split('#').join('%23'),
  'C: 固定色 #2563eb': 'data:image/svg+xml,' + ('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">' + "<rect width='1200' height='800' fill='#2563eb'/>" + '</svg>').split('#').join('%23'),
  'D: 变量 + fill-opacity .1': 'data:image/svg+xml,' + ('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">' + "<rect width='1200' height='800' fill='var(--primary)' fill-opacity='.1'/>" + '</svg>').split('#').join('%23'),
};
const root = document.getElementById('root');
for (const [k, v] of Object.entries(variants)) {
  const t = document.createElement('div'); t.textContent = k;
  const im = document.createElement('img'); im.src = v; im.alt = k;
  root.append(t, im);
}
</script></body></html>
